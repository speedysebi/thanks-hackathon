# CI/CD for ImpactText.
#   Every push and pull request: tests -> browser (emulated phones) + docker (the image Render runs).
#   Push to main with everything green: tell Render to deploy (needs the RENDER_DEPLOY_HOOK_URL secret).
# No API keys are used here: the AI parts fall back to the free keyword reader, so CI costs nothing.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHON_VERSION: "3.13"

jobs:
  tests:
    name: Tests (access, two-step, privacy, accuracy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Everything compiles
        run: python -m compileall -q app eval
      - name: Admin vs regular person, two-step sign-in, every route
        run: python -m eval.auth_test
      - name: Calendars, spreadsheet links, phone app
        run: python -m eval.integrations_test
      - name: Hostile and odd inputs, privacy scrubbing
        run: python -m eval.robustness
      - name: Keyword reader accuracy stays at 88%+ on every set
        run: python -m eval.run_eval --min 88
      - name: Every SMS reply fits in one text
        run: python -m eval.sms_cost

  browser:
    name: Emulated iPhone / Android / desktop
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADMIN_PASSWORD: sim-admin
      ADMIN_TOTP_SECRET: JBSWY3DPEHPK3PXP   # test-only authenticator key; never use it for a real server
      IMPACT_DB: ${{ github.workspace }}/ci-data/impact.db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Seed synthetic demo data and start the server
        run: |
          mkdir -p ci-data
          python -m app.seed --reset
          nohup python -m uvicorn app.main:app --port 8777 > ci-data/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8777/api/health && break; sleep 1; done
      - name: Click through every flow and page
        run: CHROME_BIN=$(command -v google-chrome) python -m eval.browser_test http://127.0.0.1:8777 screenshots
      - name: Server log
        if: failure()
        run: cat ci-data/server.log
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14

  docker:
    name: Deploy image builds and runs
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build the image Render runs
        run: docker build -t impacttext:ci .
      - name: Start it with a disk at /data, like Render
        run: |
          docker volume create impact-data
          docker run -d --name app -p 8000:8000 -v impact-data:/data \
            -e ADMIN_PASSWORD=docker-admin-pw -e ADMIN_TOTP_SECRET=JBSWY3DPEHPK3PXP impacttext:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
      - name: Smoke test inside the container
        run: docker exec app python -m eval.smoke http://127.0.0.1:8000 docker-admin-pw JBSWY3DPEHPK3PXP
      - name: Notes survive a restart (the disk works)
        run: |
          docker restart app
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
          docker exec app python -m eval.smoke http://127.0.0.1:8000 docker-admin-pw JBSWY3DPEHPK3PXP --expect-existing
      - name: Container log
        if: always()
        run: docker logs app

  deploy:
    name: Deploy to Render
    needs: [tests, browser, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger the Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::Not deployed: add the RENDER_DEPLOY_HOOK_URL secret (Render -> Settings -> Deploy Hook). See docs/LAUNCH_CHECKLIST.md."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Render deploy started for ${GITHUB_SHA::7}."
