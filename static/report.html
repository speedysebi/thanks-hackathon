<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ImpactText · Impact report</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#b4232f">
  <link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ImpactText">
  <script src="/static/pwa.js" defer></script>
  <script src="/static/nav.js" defer></script>
  <style>
    main { max-width: 820px; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .paper { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 32px; }
    .paper h1 { font-size: 28px; }
    .paper h2 { margin-top: 22px; font-size: 19px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 18px 0; }
    .kpis div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    .kpis b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
    .foot { margin-top: 26px; font-size: 13px; }
    @media (max-width: 520px) { .paper { padding: 18px; } }
    @media print {
      #mail, #mailNote { display: none !important; }
      nav, .controls { display: none !important; }
      body { background: #fff; color: #000; }
      .paper { border: 0; padding: 0; }
      main { max-width: none; padding: 0; }
    }
  </style>
</head>
<body>
<main>
  <nav data-nav></nav>
  <div class="controls">
    <select id="days" style="width:auto" aria-label="Report period">
      <option value="7">Last 7 days</option><option value="30">Last 30 days</option>
      <option value="90">Last 90 days</option><option value="365">Last 12 months</option>
    </select>
    <button id="regen" class="ghost">↻ Rewrite</button>
    <button id="print">🖨 Print / Save PDF</button>
    <button id="mail" class="ghost hidden">✉ Email last month's report</button>
  </div>
  <p class="small muted hidden" id="mailNote" role="status"></p>
  <article class="paper" id="paper"><p class="muted">Writing your report…</p></article>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// tiny Markdown: headings, bullets, bold, paragraphs (text is escaped first)
function md(src) {
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  let html = '', list = false;
  for (const raw of src.split('\n')) {
    const line = raw.trim();
    if (/^[-*] /.test(line)) { if (!list) { html += '<ul>'; list = true; } html += `<li>${inline(line.slice(2))}</li>`; continue; }
    if (!line) continue;
    if (list) { html += '</ul>'; list = false; }
    const h = line.match(/^(#{1,3})\s+(.*)/);
    html += h ? `<h2>${inline(h[2])}</h2>` : `<p>${inline(line)}</p>`;
  }
  return html + (list ? '</ul>' : '');
}
const params = new URLSearchParams(location.search);
$('days').value = params.get('days') || '30';
async function load() {
  $('paper').innerHTML = '<p class="muted">Writing your report…</p>';
  $('regen').disabled = true;
  const r = await fetch('/api/report?days=' + $('days').value).then((r) => r.json());
  const s = r.summary;
  const range = `${new Date(s.since + 'T00:00').toLocaleDateString(undefined, { dateStyle: 'long' })} – ${new Date().toLocaleDateString(undefined, { dateStyle: 'long' })}`;
  const k = [['People served', s.people_served], ['Youth served', s.youth_served], ['Activities', s.entries], ['Referrals', s.referrals], ['Volunteers active', s.workers]];
  $('paper').innerHTML = `
    <h1>Community impact report</h1>
    <div class="muted">ComForce MKE · ${range}</div>
    <div class="kpis">${k.map(([l, v]) => `<div><b>${(v ?? 0).toLocaleString()}</b><span class="small muted">${l}</span></div>`).join('')}</div>
    ${md(r.markdown)}
    <p class="foot muted">Generated from ${s.entries} field entries logged by ComForce workers by text, voice and web. Names of people served are never recorded. ${r.writer === 'ai' ? 'Draft written with AI from the logged data. Review before sending.' : ''}</p>`;
  $('regen').disabled = false;
}
$('days').onchange = () => { history.replaceState(null, '', '?days=' + $('days').value); load(); };
$('regen').onclick = load;
$('print').onclick = () => window.print();
async function mailStatus() {
  const r = await fetch('/api/report/email'); if (!r.ok) return;
  const st = await r.json();
  if (!st.configured) return;  // the button only shows once SMTP_HOST and REPORT_TO are set
  $('mail').classList.remove('hidden'); $('mailNote').classList.remove('hidden');
  const last = st.sent[0];
  $('mailNote').textContent = `Each month's report is emailed to ${st.to.join(', ')} in the first week of the next month.`
    + (last ? ` Last sent: ${last.month} on ${last.sent_at.slice(0, 10)}.` : '');
}
$('mail').onclick = async () => {
  if (!confirm("Email last month's report now?")) return;
  $('mail').disabled = true;
  const r = await fetch('/api/report/email', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  const j = await r.json().catch(() => ({}));
  $('mail').disabled = false;
  if (!r.ok) { $('mailNote').textContent = j.detail || 'Not sent (' + r.status + ').'; return; }
  $('mailNote').textContent = 'Sent to ' + j.to.join(', ') + '.'; mailStatus();
};
load();
mailStatus();
</script>
</body>
</html>
